<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>No Need Ask IO</title>
<meta name="theme-color" content="#0B0C10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ask IO">
<meta name="description" content="REDEFINE team app: ask any ePartner question and get the steps, with screenshots of where to tap.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<div id="sheet" class="sheet" hidden></div>
<div id="viewer" class="viewer" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<input id="fPack" type="file" accept=".json,application/json" multiple hidden>
<input id="fCam" type="file" accept="image/*" capture="environment" hidden>
<input id="fUp" type="file" accept="image/*,application/pdf,.pdf" multiple hidden>
<script src="config.js"></script>
<script src="match.js"></script>
<script src="near.js"></script>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator && location.protocol==='https:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));</script>
</body>
</html>
